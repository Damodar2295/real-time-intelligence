<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" fill="white" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3872A5" /></marker><marker id="future" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AA8539" /></marker><marker id="test" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8A5DB0" /></marker></defs><polyline points="440,610.0 550,610.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="1000,610.0 1160,610.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="1620,610.0 1840,610.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="1390.0,510 1390.0,400" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="775.0,720 775,985 1160,985.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="1760,985.0 1930,985.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><text x="1280.0" text-anchor="middle" y="61.0" font-family="Arial" font-size="36" font-weight="bold" fill="#002663">Vantage Real Time Intelligence</text><text x="50" text-anchor="start" y="124.7" font-family="Arial" font-size="24" font-weight="bold" fill="#002663">03 · Intelligence Delivery</text><text x="50" text-anchor="start" y="162.0" font-family="Arial" font-size="24" font-weight="normal" fill="#002663">V1 — Baseline Architecture • Level 2 • Existing resolution / output domain; later activation remains selective</text><rect x="50" y="520" width="390" height="180" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="64" text-anchor="start" y="574.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Detector evidence</text><text x="64" text-anchor="start" y="609.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Rule / semantic / LLM</text><text x="64" text-anchor="start" y="636.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">evidence</text><text x="64" text-anchor="start" y="662.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Completion semantics OPEN</text><rect x="550" y="500" width="450" height="220" fill="#EAF4FF" stroke="#006FCF" stroke-width="2" /><text x="564" text-anchor="start" y="574.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Shared Signal Resolution</text><text x="564" text-anchor="start" y="609.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Evidence-based acceptance</text><text x="564" text-anchor="start" y="636.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Method-specific thresholds</text><text x="564" text-anchor="start" y="662.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Calibration / conflicts OPEN</text><rect x="1160" y="510" width="460" height="200" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1174" text-anchor="start" y="587.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Signal publication API</text><text x="1174" text-anchor="start" y="622.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Accepted signal events</text><text x="1174" text-anchor="start" y="649.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Delivery / persistence proposed</text><rect x="1840" y="510" width="650" height="200" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="1854" text-anchor="start" y="587.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Signal workbench</text><text x="1854" text-anchor="start" y="622.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Evidence + latency display</text><text x="1854" text-anchor="start" y="649.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Consumer access / hosting OPEN</text><rect x="1160" y="220" width="460" height="180" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="1174" text-anchor="start" y="287.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Result persistence</text><text x="1174" text-anchor="start" y="322.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Cloud SQL · PostgreSQL proposed</text><text x="1174" text-anchor="start" y="349.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Authority / write ordering OPEN</text><rect x="1160" y="900" width="600" height="170" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="1174" text-anchor="start" y="962.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Contextual generation / activation</text><text x="1174" text-anchor="start" y="997.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">LATER • selective follow-on</text><text x="1174" text-anchor="start" y="1024.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Any LLM invocation requires SafeChain</text><rect x="1930" y="900" width="560" height="170" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="1944" text-anchor="start" y="962.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Downstream consumers</text><text x="1944" text-anchor="start" y="997.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Later activation / output</text><text x="1944" text-anchor="start" y="1024.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Contract and authorization OPEN</text><rect x="50" y="1120" width="1170" height="170" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="64" text-anchor="start" y="1169.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Delivery contract</text><text x="64" text-anchor="start" y="1204.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Workbench SSE / WebSocket over HTTPS is proposed.</text><text x="64" text-anchor="start" y="1231.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Reconnect, correction handling, freshness and consumer</text><text x="64" text-anchor="start" y="1257.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">authorization remain open; no new channel introduced.</text><rect x="1290" y="1120" width="1200" height="170" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="1304" text-anchor="start" y="1169.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Reliability and operations</text><text x="1304" text-anchor="start" y="1204.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Agree decision / delivery identity, idempotent effects,</text><text x="1304" text-anchor="start" y="1231.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">write-versus-publish consistency and failure ownership.</text><text x="1304" text-anchor="start" y="1257.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Observe latency, duplicates, failed delivery and access.</text><text x="50" text-anchor="start" y="1363.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">VIEW NOTATION</text><text x="50" text-anchor="start" y="1398.5" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Blue: documented logical relationship • Amber: proposed / later interface. SafeChain is mandatory for LLM use; its API and physical hosting remain open.</text><rect x="428.5" y="462" width="133.0" height="23" fill="white" /><text x="495.0" y="476" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edges-13/14/15</text><rect x="996.5" y="462" width="167.0" height="23" fill="white" /><text x="1080.0" y="476" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edge-20 • accepted</text><rect x="1646.5" y="576" width="167.0" height="23" fill="white" /><text x="1730" y="590" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edge-21 • delivery</text><rect x="1310.75" y="433.0" width="158.5" height="23" fill="white" /><text x="1390.0" y="447.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edge-22 • persist</text><rect x="872.25" y="961" width="175.5" height="23" fill="white" /><text x="960" y="975" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edge-23 • selective</text><rect x="1756.5" y="862" width="167.0" height="23" fill="white" /><text x="1840" y="876" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">edge-24 • delivery</text></svg>