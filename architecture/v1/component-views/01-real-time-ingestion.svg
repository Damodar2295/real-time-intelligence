<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" fill="white" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3872A5" /></marker><marker id="future" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AA8539" /></marker><marker id="test" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8A5DB0" /></marker></defs><rect x="1410" y="215" width="1100" height="410" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="1410" y="215" width="1100" height="44" fill="#002663" /><rect x="50" y="690" width="1580" height="255" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="50" y="690" width="1580" height="44" fill="#002663" /><polyline points="410,325.0 480,325.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="840,325.0 910,325.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="1330,325.0 1370.0,325.0 1370.0,420.0 1410,420.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="1960.0,625 1960,650 310,650 310.0,765" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="530,835.0 620,835.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="1060,835.0 1150,835.0" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="840.0,905 840,985 2130,985 2130.0,910" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="2130.0,910 2130,1010 430,1010 430.0,1045" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><text x="1280.0" text-anchor="middle" y="61.0" font-family="Arial" font-size="36" font-weight="bold" fill="#002663">Vantage Real Time Intelligence</text><text x="50" text-anchor="start" y="124.7" font-family="Arial" font-size="24" font-weight="bold" fill="#002663">01 · Real-Time Ingestion</text><text x="50" text-anchor="start" y="162.0" font-family="Arial" font-size="24" font-weight="normal" fill="#002663">V1 — Baseline Architecture • Level 2 • Required design behavior; runtime implementation not demonstrated</text><rect x="50" y="245" width="360" height="160" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="64" text-anchor="start" y="289.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Concurrent sources</text><text x="64" text-anchor="start" y="324.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Genesys via audio / STT</text><text x="64" text-anchor="start" y="351.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Separate transcript</text><text x="64" text-anchor="start" y="377.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">emulator</text><rect x="480" y="245" width="360" height="160" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="494" text-anchor="start" y="289.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Transcript ingress</text><text x="494" text-anchor="start" y="324.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Frame / validate updates</text><text x="494" text-anchor="start" y="351.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Retain call / session</text><text x="494" text-anchor="start" y="377.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">identity</text><rect x="910" y="245" width="420" height="160" fill="#EAF4FF" stroke="#006FCF" stroke-width="2" /><text x="924" text-anchor="start" y="302.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Redis Streams</text><text x="924" text-anchor="start" y="337.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">E1  E2  E3  E4  E5  E6</text><text x="924" text-anchor="start" y="364.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Concurrent entry publication</text><text x="1424" text-anchor="start" y="244" font-family="Arial" font-size="21" font-weight="bold" fill="white">Vantage Ingestion Consumer Group • XREADGROUP</text><rect x="1450" y="325" width="310" height="150" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1464" text-anchor="start" y="364.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Consumer A</text><text x="1464" text-anchor="start" y="399.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">E1, E4</text><text x="1464" text-anchor="start" y="426.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Parallel worker</text><text x="1464" text-anchor="start" y="452.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">instance</text><rect x="1800" y="325" width="310" height="150" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1814" text-anchor="start" y="364.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Consumer B</text><text x="1814" text-anchor="start" y="399.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">E2, E5</text><text x="1814" text-anchor="start" y="426.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Parallel worker</text><text x="1814" text-anchor="start" y="452.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">instance</text><rect x="2150" y="325" width="310" height="150" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="2164" text-anchor="start" y="364.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Consumer C</text><text x="2164" text-anchor="start" y="399.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">E3, E6</text><text x="2164" text-anchor="start" y="426.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Parallel worker</text><text x="2164" text-anchor="start" y="452.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">instance</text><text x="1450" text-anchor="start" y="527.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Illustrative parallel distribution</text><text x="1450" text-anchor="start" y="562.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Actual message assignment depends on consumer availability and read behavior; not</text><text x="1450" text-anchor="start" y="589.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">fixed round-robin.</text><text x="64" text-anchor="start" y="719" font-family="Arial" font-size="21" font-weight="bold" fill="white">Worker responsibilities • repeated per consumer; no new deployment boundaries</text><rect x="90" y="765" width="440" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="104" text-anchor="start" y="812.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Validate + prepare</text><text x="104" text-anchor="start" y="847.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Normalize • idempotency</text><text x="104" text-anchor="start" y="874.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Session windows / context</text><rect x="620" y="765" width="440" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="634" text-anchor="start" y="812.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Detection handoff</text><text x="634" text-anchor="start" y="847.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Selected downstream processing</text><text x="634" text-anchor="start" y="874.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Commit boundary remains OPEN</text><rect x="1150" y="765" width="440" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1164" text-anchor="start" y="812.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">XACK</text><text x="1164" text-anchor="start" y="847.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">After processing success or</text><text x="1164" text-anchor="start" y="874.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">verified durable handoff</text><rect x="1750" y="730" width="760" height="180" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="1764" text-anchor="start" y="797.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Pending Entries List</text><text x="1764" text-anchor="start" y="832.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Unacknowledged work</text><text x="1764" text-anchor="start" y="859.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Recovery ownership / timing OPEN</text><rect x="50" y="1045" width="760" height="200" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="64" text-anchor="start" y="1122.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Eligible pending recovery</text><text x="64" text-anchor="start" y="1157.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">XAUTOCLAIM only if supported and policy approved.</text><text x="64" text-anchor="start" y="1184.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Reprocess idempotently; do not steal live work.</text><rect x="875" y="1045" width="760" height="200" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="889" text-anchor="start" y="1122.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Retry / dead-letter considerations</text><text x="889" text-anchor="start" y="1157.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Required design, not implemented. Limits, destination,</text><text x="889" text-anchor="start" y="1184.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">redrive and durable-handoff / ack policy are TBD.</text><rect x="1700" y="1045" width="810" height="200" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="1714" text-anchor="start" y="1109.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Isolation and operations</text><text x="1714" text-anchor="start" y="1144.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Completion order is not guaranteed. Call ownership OPEN.</text><text x="1714" text-anchor="start" y="1171.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Monitor lag, pending age, latency, retries and DLQ volume.</text><text x="1714" text-anchor="start" y="1197.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Bound intake; scaling and backpressure policy TBD.</text><text x="50" text-anchor="start" y="1363.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">VIEW NOTATION</text><text x="50" text-anchor="start" y="1398.5" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Blue: logical processing • Amber dashed: failure / required policy • At-least-once handling; no exactly-once claim. Consumer parallelism is not internal API parallelism.</text><rect x="361.5" y="207" width="167.0" height="23" fill="white" /><text x="445.0" y="221" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Transcript updates</text><rect x="804.25" y="207" width="141.5" height="23" fill="white" /><text x="875.0" y="221" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Publish entries</text><rect x="899.5" y="628" width="201.0" height="23" fill="white" /><text x="1000" y="642" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Each consumer executes</text><rect x="504.25" y="737" width="141.5" height="23" fill="white" /><text x="575" y="751" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Detection input</text><rect x="1030.0" y="737" width="150.0" height="23" fill="white" /><text x="1105" y="751" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Success boundary</text><rect x="1696.75" y="961" width="226.5" height="23" fill="white" /><text x="1810" y="975" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Interrupted / failed work</text><rect x="918.5" y="996" width="303.0" height="23" fill="white" /><text x="1070" y="1010" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Recovery → worker responsibilities</text></svg>