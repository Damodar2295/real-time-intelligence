xt><text x="534" text-anchor="start" y="382.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Frame updates</text><text x="534" text-anchor="start" y="409.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Preserve session identity</text><rect x="960" y="300" width="350" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="974" text-anchor="start" y="347.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">3 · Redis Streams</text><text x="974" text-anchor="start" y="382.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Concurrent publishing</text><text x="974" text-anchor="start" y="409.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Consumer-group handoff</text><rect x="1400" y="300" width="450" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1414" text-anchor="start" y="347.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">4 · Consumer processing</text><text x="1414" text-anchor="start" y="382.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Validate • normalize</text><text x="1414" text-anchor="start" y="409.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Idempotent handling</text><rect x="1940" y="300" width="530" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1954" text-anchor="start" y="347.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">5 · Context preparation</text><text x="1954" text-anchor="start" y="382.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Session windows</text><text x="1954" text-anchor="start" y="409.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Bounded call context</text><text x="64" text-anchor="start" y="579" font-family="Arial" font-size="21" font-weight="bold" fill="white">INTELLIGENCE PROCESSING</text><rect x="80" y="630" width="620" height="150" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="94" text-anchor="start" y="682.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">6 · Select applicable methods</text><text x="94" text-anchor="start" y="717.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Catalog + call metadata + context</text><text x="94" text-anchor="start" y="744.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">One or more configured strategies</text><rect x="850" y="630" width="650" height="150" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="864" text-anchor="start" y="682.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">7 · Detection evidence</text><text x="864" text-anchor="start" y="717.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Deterministic / semantic / LLM</text><text x="864" text-anchor="start" y="744.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Scheduling and completion OPEN</text><rect x="1720" y="630" width="750" height="150" fill="#EAF4FF" stroke="#006FCF" stroke-width="2" /><text x="1734" text-anchor="start" y="682.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">SafeChain Integration</text><text x="1734" text-anchor="start" y="717.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Secure LLM Invocation</text><text x="1734" text-anchor="start" y="744.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Only when an LLM is required</text><text x="64" text-anchor="start" y="919" font-family="Arial" font-size="21" font-weight="bold" fill="white">INTELLIGENCE DELIVERY • RESOLUTION / OUTPUT</text><rect x="80" y="970" width="620" height="140" fill="#EAF4FF" stroke="#006FCF" stroke-width="2" /><text x="94" text-anchor="start" y="1017.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">8 · Governed result</text><text x="94" text-anchor="start" y="1052.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Shared Signal Resolution</text><text x="94" text-anchor="start" y="1079.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Evidence + thresholds; policy OPEN</text><rect x="850" y="970" width="650" height="140" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="864" text-anchor="start" y="1017.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">9 · Intelligence delivery</text><text x="864" text-anchor="start" y="1052.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Accepted signal publication</text><text x="864" text-anchor="start" y="1079.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Proposed result persistence</text><rect x="1720" y="970" width="750" height="140" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="1734" text-anchor="start" y="1017.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">10 · Consume intelligence</text><text x="1734" text-anchor="start" y="1052.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Workbench; selective later activation</text><text x="1734" text-anchor="start" y="1079.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Authorized downstream consumers</text><rect x="50" y="1200" width="2460" height="110" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><text x="64" text-anchor="start" y="1232.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Recovery requirement — not an implemented runtime flow</text><text x="64" text-anchor="start" y="1267.6" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Read → process / verified durable handoff → XACK. Interrupted work remains pending; eligible recovery must be idempotent.</text><text x="64" text-anchor="start" y="1294.4" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Retry / dead-letter policy TBD. Duplicate or late events must not silently corrupt call state. Delivery failure ownership remains OPEN.</text><text x="50" text-anchor="start" y="1363.7" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">VIEW NOTATION</text><text x="50" text-anchor="start" y="1398.5" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Lanes are logical responsibilities, not deployments. No fixed detector chain. SafeChain returns through the invoking LLM adapter; no direct-provider route.</text><rect x="1111.0" y="491" width="218.0" height="23" fill="white" /><text x="1220" y="505" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Prepared input + context</text><rect x="678.75" y="592" width="192.5" height="23" fill="white" /><text x="775.0" y="606" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Configured evaluation</text><rect x="1509.5" y="681" width="201.0" height="23" fill="white" /><text x="1610" y="695" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Conditional invocation</text><rect x="749.0" y="831" width="82.0" height="23" fill="white" /><text x="790" y="845" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Evidence</text><rect x="700.0" y="1018.0" width="150.0" height="23" fill="white" /><text x="775.0" y="1032.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Accepted signals</text><rect x="1526.5" y="1018.0" width="167.0" height="23" fill="white" /><text x="1610.0" y="1032.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Workbench delivery</text><rect x="982.25" y="1156" width="515.5" height="23" fill="white" /><text x="1240" y="1170" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Selective later activation • SafeChain required for LLM use</text><rect x="1947.5" y="181" width="405.0" height="23" fill="white" /><text x="2150" y="195" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Interrupted work → pending recovery (required)</text></svg>