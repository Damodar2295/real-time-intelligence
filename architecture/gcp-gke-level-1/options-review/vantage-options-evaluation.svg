<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680"><rect x="0" y="0" width="2400" height="1680" fill="white" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3872A5" /></marker><marker id="future" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AA8539" /></marker><marker id="test" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8A5DB0" /></marker></defs><rect x="40" y="180" width="480" height="470" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="40" y="180" width="480" height="44" fill="#002663" /><rect x="1100" y="180" width="590" height="590" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="1100" y="180" width="590" height="44" fill="#002663" /><rect x="40" y="850" width="720" height="350" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="40" y="850" width="720" height="44" fill="#002663" /><rect x="800" y="850" width="850" height="350" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="800" y="850" width="850" height="44" fill="#002663" /><rect x="1690" y="850" width="660" height="350" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="1690" y="850" width="660" height="44" fill="#002663" /><rect x="40" y="1250" width="2310" height="270" fill="#EAF4FF" stroke="#B7C9D3" stroke-width="1" /><rect x="40" y="1250" width="2310" height="44" fill="#002663" /><polyline points="495,337.5 550,337.5 550,400 600,400 600,435.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="495,530.0 560,530 560,480 600,480 600,435.0" fill="none" stroke="#8A5DB0" stroke-width="1.8" marker-end="url(#test)" /><polyline points="1010,435.0 1055.0,435.0 1055.0,475.0 1100,475.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="1690,475.0 1750.0,475.0 1750.0,435.0 1810,435.0" fill="none" stroke="#AA8539" stroke-width="1.8" marker-end="url(#future)" stroke-dasharray="7 4" /><polyline points="2080.0,535 2080.0,620" fill="none" stroke="#3872A5" stroke-width="1.8" marker-end="url(#arrow)" /><text x="40" y="54.2" font-family="Arial" font-size="30" font-weight="bold" fill="#002663">VANTAGE Intelligence | Handoff &amp; Windowing | Alternatives</text><text x="40" y="106.6" font-family="Arial" font-size="20" font-weight="normal" fill="#002663">13 October 2026 • Evaluation choices, not approved topology • Both sources use the same selected processing path</text><text x="40" y="131.0" font-family="Arial" font-size="20" font-weight="normal" fill="#002663">Choose one handoff per configuration. No dual publishing, source-specific broker, or automatic fallback implied.</text><text x="54" y="209" font-family="Arial" font-size="21" font-weight="bold" fill="white">SOURCE ADAPTERS</text><rect x="65" y="250" width="430" height="175" fill="#EEF3F8" stroke="#839CAE" stroke-width="1" /><text x="79" y="303.3" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Genesys source</text><text x="79" y="336.9" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Provider transcript events OR</text><text x="79" y="362.5" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">audio → acquisition → STT</text><text x="79" y="388.1" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Contract / coexistence OPEN</text><rect x="65" y="465" width="430" height="130" fill="#F1EBFA" stroke="#9879B9" stroke-width="1" /><text x="79" y="508.6" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Transcript emulator</text><text x="79" y="542.2" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Separate TEST source</text><text x="79" y="567.8" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Same transcript contract</text><rect x="600" y="335" width="410" height="200" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="614" y="400.8" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Transcript ingress</text><text x="614" y="434.4" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Connection / source adaptation</text><text x="614" y="460.0" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Event framing • call identity</text><text x="614" y="485.6" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Preserve revision / finality</text><text x="1114" y="209" font-family="Arial" font-size="21" font-weight="bold" fill="white">HANDOFF ALTERNATIVES • CHOOSE ONE</text><rect x="1130" y="255" width="530" height="130" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="1214" y="298.6" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">A • Cloud Pub/Sub</text><text x="1214" y="332.2" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Current proposal</text><text x="1214" y="357.8" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Lumi approval + latency validation</text><rect x="1130" y="420" width="530" height="175" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="1214" y="473.3" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">B • Redis Streams</text><text x="1214" y="506.9" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Proposed alternative</text><text x="1214" y="532.5" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Hosting / Lumi approval OPEN</text><text x="1214" y="558.1" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Consumer and recovery policy OPEN</text><text x="1130" y="664.2" font-family="Arial" font-size="19" font-weight="normal" fill="#002663">A and B are mutually exclusive test choices.</text><text x="1130" y="687.4" font-family="Arial" font-size="19" font-weight="normal" fill="#002663">Redis messaging is distinct from context cache;</text><text x="1130" y="710.6" font-family="Arial" font-size="19" font-weight="normal" fill="#002663">shared instance not assumed.</text><rect x="1810" y="335" width="540" height="200" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="1824" y="400.8" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Conversation processing</text><text x="1824" y="434.4" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Concurrent calls • bounded context</text><text x="1824" y="460.0" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Per-call ordering / ownership OPEN</text><text x="1824" y="485.6" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Windowing location: compare below</text><rect x="1810" y="620" width="540" height="160" fill="#EAF4FF" stroke="#006FCF" stroke-width="2" /><text x="1824" y="665.8" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Existing detection &amp; output</text><text x="1824" y="699.4" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Selective methods → evidence resolution</text><text x="1824" y="725.0" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Acceptance / completion rules OPEN</text><text x="1824" y="750.6" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Publication and later activation retained</text><text x="54" y="879" font-family="Arial" font-size="21" font-weight="bold" fill="white">C • COLOCATED PROTOTYPE OPTION</text><rect x="65" y="925" width="670" height="210" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="79" y="994.3" font-family="Arial" font-size="22" font-weight="bold" fill="#002663">Ingress → bounded local queue → processing</text><text x="79" y="1029.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Inside one application process</text><text x="79" y="1056.0" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Not a shared cross-instance broker</text><text x="79" y="1082.8" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Restart loss, overload and call placement OPEN</text><text x="814" y="879" font-family="Arial" font-size="21" font-weight="bold" fill="white">WINDOW ASSEMBLY • SEPARATE DECISION</text><rect x="825" y="920" width="800" height="95" fill="#FFFFFF" stroke="#A5BAC8" stroke-width="1" /><text x="839" y="958.9" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">Retain V4: workers assemble windows</text><text x="839" y="992.5" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Ingress frames transcript events before handoff.</text><rect x="825" y="1035" width="800" height="140" fill="#FFFFFF" stroke="#B29145" stroke-width="1" stroke-dasharray="7 4" /><text x="839" y="1084.4" font-family="Arial" font-size="20" font-weight="bold" fill="#002663">Team proposal: ingress assembles windows</text><text x="839" y="1116.8" font-family="Arial" font-size="20" font-weight="normal" fill="#002663">Adds call-window state to ingress; evaluate lifecycle and delay.</text><text x="839" y="1141.2" font-family="Arial" font-size="20" font-weight="normal" fill="#002663">Transport framing is not detection microbatching.</text><text x="1704" y="879" font-family="Arial" font-size="21" font-weight="bold" fill="white">EVALUATION GATES</text><text x="1715" y="997.0" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Actual payload and transcript revisions</text><text x="1715" y="1022.6" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Freshness versus loss / recovery by scenario</text><text x="1715" y="1048.2" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Call isolation • P95/P99 • quality • cost</text><text x="1715" y="1073.8" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Lumi service access and operating owner</text><text x="1715" y="1099.4" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Same workload; document guarantee differences</text><text x="54" y="1279" font-family="Arial" font-size="21" font-weight="bold" fill="white">LUMI &amp; STORAGE • NO NEW PRODUCT APPROVAL</text><text x="70" y="1384.2" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Confirm Pub/Sub / Redis / model access and supported versions with Lumi. GKE remains target; no Cloud Run migration implied.</text><text x="70" y="1411.1" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">Choose stores separately for call context, catalog/versioning, vectors, and accepted evidence. PostgreSQL direction retained provisionally.</text><text x="70" y="1437.9" font-family="Arial" font-size="22" font-weight="normal" fill="#002663">History writer, threshold policy, acceptable loss and security ownership remain decisions. No zero-latency or lossless guarantee.</text><text x="40" y="1581.1" font-family="Arial" font-size="21" font-weight="bold" fill="#002663">READING GUIDE</text><text x="40" y="1614.7" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Amber dashed cards/links = proposed alternatives • Purple = test source • Containers describe choices, not deployed security zones.</text><text x="40" y="1640.3" font-family="Arial" font-size="21" font-weight="normal" fill="#002663">Page 1 preserves baseline dependencies; this page expands decision options without selecting technologies or changing V4.</text><rect x="466.5" y="346.75" width="167.0" height="23" fill="white" /><text x="550.0" y="360.75" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Transcript updates</text><rect x="478.0" y="508.0" width="99.0" height="23" fill="white" /><text x="527.5" y="522.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Test input</text><rect x="957.5" y="413.0" width="150.0" height="23" fill="white" /><text x="1032.5" y="427.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Selected handoff</text><rect x="1619.5" y="453.0" width="201.0" height="23" fill="white" /><text x="1720.0" y="467.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#002663">Selected consumer path</text><image x="1144" y="294.0" width="52" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64," /><image x="1144" y="481.5" width="52" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64," /></svg>